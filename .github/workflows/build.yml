name: build

# Build + test on the hosted runners. The core tier is pure CPU, over recon's
# camera tier and GLM, so no GPU/Vulkan toolchain is needed — unlike
# volumetric_kit_gfx (tests/no_vulkan checks it). Both an
# unoptimized Debug and an optimized Release/NDEBUG configuration are exercised,
# so an NDEBUG-only or optimizer-exposed break is caught. The macOS legs also
# build the OpenCV tiers (VC_WITH_OPENCV), on Homebrew's OpenCV (DECISIONS.md,
# 2026-10-12), and the rig job the rig tiers (VC_WITH_RIG, 2026-10-13).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }}${{ matrix.shared == 'ON' && ' shared' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
        shared: ['OFF']
        include:
          # Shared libraries, with the OpenCV tiers: a test that calls a public
          # symbol left unexported fails to link.
          - os: macos-latest
            build_type: Release
            shared: 'ON'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libglm-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        # OpenCV brings many bottles; retry to ride out a transient fetch error.
        run: |
          for attempt in 1 2 3; do
            brew install cmake glm opencv && exit 0
            echo "::warning::brew install attempt ${attempt} failed; retrying"
            sleep 15
          done
          exit 1

      # Cache the FetchContent dependency tree (googletest sources + build) so it
      # is not re-cloned and recompiled every run.
      - name: Cache third-party deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.shared }}-${{ hashFiles('third_party/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.shared }}-

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVC_WITH_OPENCV=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The rig tiers, which take all of recon and so the Vulkan SDK: calib builds
  # recon's sensor, video and Orbbec tiers, and gfx for the viz tier, against
  # calib's core pin, the core every sibling compiles against in the rig
  # application. The viz tier's GPU tests need a device (MoltenVK) and run
  # under the validation layer. The Orbbec SDK comes from recon's own action,
  # at calib's recon pin.
  rig:
    name: macos-latest Release rig
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          for attempt in 1 2 3; do
            brew install cmake glm opencv molten-vk vulkan-headers \
              vulkan-loader vulkan-validationlayers shaderc ffmpeg pkgconf &&
              break
            echo "::warning::brew install attempt ${attempt} failed; retrying"
            [ "${attempt}" = 3 ] && exit 1
            sleep 15
          done
          # The layer's manifest names its library without a path; the Test
          # step alone searches Homebrew's lib for it, as job-wide its
          # libraries would shadow those of every other tool.
          echo "VC_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # Keep the ref at calib's recon pin (third_party/CMakeLists.txt).
      - name: Install the Orbbec SDK
        uses: taojin-6/volumetric_kit_recon/.github/actions/install-orbbec-sdk@bdbe26e1378a3d4ab46bb89da05b318f6cfe82c2

      - name: Cache third-party deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-rig-macos-${{ hashFiles('third_party/CMakeLists.txt') }}
          restore-keys: |
            deps-rig-macos-

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVC_WITH_OPENCV=ON
          -DVC_WITH_RIG=ON -DVR_WITH_ORBBEC=ON -DVR_WITH_FFMPEG=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          # The core's test policy: a GPU test fails, rather than skips,
          # without a device or the validation layer, and fails on any error
          # the layer reports.
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
        # Set on the command, as macOS strips DYLD_* from a step's env when it
        # starts the system's bash.
        run: |
          DYLD_FALLBACK_LIBRARY_PATH="${VC_LAYER_LIBRARY_PATH}" \
            ctest --test-dir build --output-on-failure
