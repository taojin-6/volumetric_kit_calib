name: build

# Build + test on the hosted runners. The core tier is pure CPU, over recon's
# camera tier and GLM, so no GPU/Vulkan toolchain is needed — unlike
# volumetric_kit_gfx (tests/no_vulkan checks it). Both an
# unoptimized Debug and an optimized Release/NDEBUG configuration are exercised,
# so an NDEBUG-only or optimizer-exposed break is caught. The macOS legs also
# build the OpenCV tiers (VC_WITH_OPENCV) on Homebrew's OpenCV 5; Ubuntu has no
# OpenCV 5 package, so its legs build without them.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libglm-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        # OpenCV brings many bottles; retry to ride out a transient fetch error.
        run: |
          for attempt in 1 2 3; do
            brew install cmake glm opencv && exit 0
            echo "::warning::brew install attempt ${attempt} failed; retrying"
            sleep 15
          done
          exit 1

      # Cache the FetchContent dependency tree (googletest sources + build) so it
      # is not re-cloned and recompiled every run.
      - name: Cache third-party deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ matrix.build_type }}-${{ hashFiles('third_party/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ matrix.os }}-${{ matrix.build_type }}-

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVC_WITH_OPENCV=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
