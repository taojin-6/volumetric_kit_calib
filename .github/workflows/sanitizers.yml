name: sanitizers

# AddressSanitizer + UndefinedBehaviorSanitizer + LeakSanitizer, Linux-only
# (LeakSanitizer isn't available on macOS). A green normal build is necessary but
# not sufficient — this is what turns the move-only / lifetime tests into actual
# leak / use-after-free / double-free detectors. It builds every tier but the
# app's (no GLFW or Orbbec SDK here; the app's threads run under
# ThreadSanitizer on a macOS leg, _build.yml): the OpenCV tiers on OpenCV 5
# from .github/actions/opencv, itself not sanitized, and the rig tiers
# (VC_WITH_RIG), whose session writer runs a thread of its own; they take all
# of recon and gfx, so the Vulkan SDK's headers, loader and shader compiler.
# The depth and viz tiers' GPU tests run on lavapipe, Mesa's software Vulkan
# driver. Invoked by ci.yml, which owns the push / pull_request triggers and
# the concurrency group.
on:
  workflow_call:

jobs:
  asan-ubsan-lsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # recon and gfx build too, sanitized; OpenCV on a miss
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      # llvm: llvm-symbolizer, so a report names its functions and
      # tests/lsan.supp's names match. lavapipe is installed with its
      # recommends: without them its runtime libraries (LLVM) are stripped and
      # it loads as INCOMPATIBLE_DRIVER. The loader is pinned to it.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang llvm libglm-dev libvulkan-dev glslang-tools spirv-tools
          sudo apt-get install -y mesa-vulkan-drivers
          icd=""
          for f in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            [ -e "$f" ] && { icd="$f"; break; }
          done
          [ -n "$icd" ] || { echo "::error::lavapipe ICD not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # The Ubuntu legs' cached OpenCV 5 (_build.yml), built with the image's
      # default compiler, not with the sanitizers.
      - name: OpenCV 5
        uses: ./.github/actions/opencv

      # Cache the FetchContent dependency tree, as _build.yml does. Here the
      # dependencies are compiled with the sanitizers too (VC_SANITIZE sets its
      # flags globally), so besides the pins the key carries everything that
      # changes their objects, as recon's sanitizer job keys it: the compiler,
      # the runner image, this workflow and vc_sanitizers.cmake, and the
      # workspace path, which FetchContent bakes in. No restore-keys: a stale
      # match would link objects built for something else.
      - name: Dependency cache key
        id: deps
        run: |
          hash() { sha256sum | cut -c1-12; }
          ws=$(printf '%s' "${GITHUB_WORKSPACE}" | hash)
          cc=$(clang --version | head -1 | hash)
          echo "key=sanitizers-deps-ws${ws}-cc${cc}-img${ImageVersion:-none}" >> "${GITHUB_OUTPUT}"

      - name: Cache third-party deps
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.key }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt', 'cmake/vc_sanitizers.cmake', '.github/workflows/sanitizers.yml') }}

      # Debug, at -O1 under the sanitizers (cmake/vc_sanitizers.cmake).
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DVC_SANITIZE="address;undefined" -DVC_WITH_RIG=ON

      # The level, not a bare --parallel (_build.yml's Build step says why).
      - name: Build
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      # The `slow` and `package` tests run on _build.yml's Release rig leg:
      # repeating a sweep's solves adds nothing under the sanitizers, and the
      # nested builds are not sanitized. AgreementTest's case of 64 captures
      # of two 8192 x 8192 depths, 2^32 samples a pair, runs on the Mac's GPU
      # alone, not on a CPU's lavapipe (where today one binding cannot hold
      # such a depth, and it skips).
      - name: Test
        env:
          # The core's test policy: a GPU test fails, rather than skips,
          # without a device.
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          # ctest runs a test binary as one test, so a case is left out here.
          GTEST_FILTER: '-AgreementTest.RefusesACaptureThatCouldPassACountsLimit'
        run: |
          ctest --test-dir build --output-on-failure -LE "slow|package" \
            --parallel "$(nproc)"
