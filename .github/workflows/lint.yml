name: lint

# Styling + hygiene gate. Runs the same hooks as the local `pre-commit` install
# (clang-format, cmake-format, trailing-whitespace, end-of-file-fixer).
# Linux-only: the formatters' output is deterministic across operating systems,
# so one runner is enough.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache pre-commit's installed hook environments (incl. the pinned
      # clang-format) keyed on the config so they're only rebuilt when it changes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-
      # Pin the runner so a new upstream pre-commit release can't change the
      # gate's behavior without a commit here.
      - run: python -m pip install pre-commit==4.6.0
      - run: pre-commit run --all-files --show-diff-on-failure
