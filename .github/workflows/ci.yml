name: ci

# Umbrella CI. Every build leg, lint and sanitizers fan out from here, and the
# single `required` job at the bottom succeeds only if all of them did. Branch
# protection, where main has it, requires just that one check ("ci /
# required"), so the required list stays stable as legs are added or renamed.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running CI. A push to main never cancels a
# running main run, but GitHub keeps one pending run per group, so of several
# quick merges only the newest waiting one runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only the owner triggers this repository's workflows, so no job carries a fork
# guard (the core's DECISIONS.md, "Only the owner triggers CI").
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The Ubuntu legs run on GitHub-hosted runners, free for a public
      # repository, on OpenCV 5 built from source and cached
      # (.github/actions/opencv), with no Vulkan. The macOS legs run on the
      # family's Mac (label `mac`), as recon's and gfx's do, on its installed
      # Homebrew OpenCV 5, Vulkan SDK, FFmpeg and GLFW, at the levels its
      # runners' .env sets: a hosted macOS job spends 2-3 minutes installing
      # those formulae and tests on 3 cores (DECISIONS.md, 2026-10-16). Every
      # leg builds every OpenCV tier. The rig leg is static: shared libraries
      # there would build core, recon and gfx shared too, which none of them
      # is.
      #
      # `runner: ''` moves a macOS leg back to a hosted runner, which then
      # installs its formulae itself.
      matrix:
        include:
          - os: ubuntu-24.04
            build_types: '["Release"]'
          - os: ubuntu-26.04
            build_types: '["Release"]'
          - os: macos-26
            runner: mac
            build_types: '["Debug"]'
            shared: true
          - os: macos-26
            runner: mac
            build_types: '["Release"]'
            rig: true
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner || '' }}
      build_types: ${{ matrix.build_types }}
      shared: ${{ matrix.shared || false }}
      rig: ${{ matrix.rig || false }}

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The one status check branch protection requires. It passes only when
    # every build leg, lint and sanitizers succeeded, and FAILS (never skips)
    # on any other outcome: a skipped required check never reports and would
    # block every merge.
    needs: [build, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
