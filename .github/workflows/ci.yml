name: ci

# Umbrella CI. Every build leg, lint and sanitizers fan out from here, and the
# single `required` job at the bottom succeeds only if all of them did. Branch
# protection, where main has it, requires just that one check ("ci /
# required"), so the required list stays stable as legs are added or renamed.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running CI. A push to main never cancels a
# running main run, but GitHub keeps one pending run per group, so of several
# quick merges only the newest waiting one runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only the owner triggers this repository's workflows, so no job carries a fork
# guard (the core's DECISIONS.md, "Only the owner triggers CI").
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every leg runs on a GitHub-hosted runner, free for a public repository
      # (DECISIONS.md, 2026-10-16): no calib job needs the family's own hosts,
      # as none draws on an NVIDIA GPU, and the hosted macOS image's GPU runs
      # MoltenVK. Every leg builds every OpenCV tier: Ubuntu on OpenCV 5 built
      # from source and cached (.github/actions/opencv), with no Vulkan; macOS
      # on Homebrew's OpenCV 5, and the rig leg on its Vulkan SDK, FFmpeg and
      # GLFW, each run from a clean image. The rig leg is static: shared
      # libraries there would build core, recon and gfx shared too, which none
      # of them is.
      #
      # A leg moves to a self-hosted runner by passing _build.yml's `runner`
      # (and, on Linux, `container`) inputs, as recon's GPU legs do.
      matrix:
        include:
          - os: ubuntu-24.04
            build_types: '["Release"]'
          - os: ubuntu-26.04
            build_types: '["Release"]'
          - os: macos-26
            build_types: '["Debug"]'
            shared: true
          - os: macos-26
            build_types: '["Release"]'
            rig: true
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      build_types: ${{ matrix.build_types }}
      shared: ${{ matrix.shared || false }}
      rig: ${{ matrix.rig || false }}

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The one status check branch protection requires. It passes only when
    # every build leg, lint and sanitizers succeeded, and FAILS (never skips)
    # on any other outcome: a skipped required check never reports and would
    # block every merge.
    needs: [build, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
