name: build (reusable)

# Build and test for one leg. ci.yml calls this once per entry in its build
# matrix, on a GitHub-hosted runner (pass just `os`) or a self-hosted one
# (`runner`), in an OS-matched container on Linux (`container`), as recon's
# _build.yml runs its legs. Release here and Debug in the sanitizer job
# (sanitizers.yml) are both exercised, so an NDEBUG-only or optimizer-exposed
# break is caught.
on:
  workflow_call:
    inputs:
      os:
        description: Leg identity, used in the job name and cache key (e.g. ubuntu-24.04).
        required: true
        type: string
      runner:
        description: >-
          runs-on label. Empty → use `os` as a GitHub-hosted image; set to a
          self-hosted label (vk-linux-gpu, mac) to run the leg there.
        required: false
        type: string
        default: ''
      container:
        description: >-
          JSON for the job container, e.g. '{"image":"ubuntu:24.04"}', or ''
          for none.
        required: false
        type: string
        default: ''
      build_types:
        description: >-
          JSON array of the CMAKE_BUILD_TYPEs this leg builds and tests, one
          job each, e.g. '["Release"]'.
        required: true
        type: string
      shared:
        description: >-
          Build shared libraries (BUILD_SHARED_LIBS): a test that calls a
          public symbol left unexported fails to link.
        required: false
        type: boolean
        default: false
      rig:
        description: >-
          Build the rig tiers (VC_WITH_RIG): recon's sensor, video and Orbbec
          tiers against calib's core pin, gfx for the viz tier, and calib_rig
          over gfx's GLFW glue. The viz and app tiers' GPU tests need a device
          (MoltenVK) and run under the validation layer. macOS only.
        required: false
        type: boolean
        default: false
      tsan:
        description: >-
          With `rig`: build under ThreadSanitizer (VC_SANITIZE=thread) only
          the tests of calib's threads, the session writer's and the app's
          workers', and run those.
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.os }}
    # Render the container JSON to a map only when one was requested; macOS
    # passes '' and runs directly on the runner. `&&` short-circuits, so
    # fromJSON is never handed the empty string.
    container: ${{ inputs.container != '' && fromJSON(inputs.container) || null }}
    timeout-minutes: 30
    env:
      # With `tsan`, the test binaries the Build step builds and the Test step
      # runs: those of calib's threads.
      VC_TSAN_TESTS: >-
        session_writer app_live app_live_view app_cloud app_capture
        app_calibrate app_calibrate_depth
    defaults:
      run:
        # A container runs `run:` steps under `sh` (dash) by default.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(inputs.build_types) }}
    steps:
      # Bare ubuntu:* images lack git (actions/checkout needs it) and sudo (the
      # install steps use it); we run as root in the container, so install them
      # before anything else. Skipped on a leg with no container.
      - name: Bootstrap container
        if: inputs.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git sudo

      # A self-hosted runner keeps its workspace, which other repositories'
      # jobs on the host can read, so the token is not left in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # build-essential: a bare ubuntu:* container has no compiler or make.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libglm-dev

      # Ubuntu's packages are OpenCV 4: OpenCV 5 is built from source, once
      # per release, and cached (DECISIONS.md, 2026-10-17).
      - name: OpenCV 5 (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/opencv

      # A hosted runner installs what its image lacks. On the family's
      # self-hosted Mac, whose Homebrew recon and gfx share, a job installs
      # nothing and fails naming any formula missing (the core's runner
      # README). pkgs names every formula the leg's build finds,
      # for the Homebrew key below: on the rig leg that includes glfw, for
      # gfx's GLFW glue, and glslang and spirv-tools, whose tools the core's
      # shader rules find.
      # TODO: take this check-or-install from a core action, as recon and gfx
      # copy it too, once the core has one.
      - name: Install dependencies (macOS)
        id: formulae
        if: runner.os == 'macOS'
        env:
          # The formulae are bottled, so skip the slow, network-heavy
          # auto-update -- its `git fetch` is what flakes on transient DNS.
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          pkgs="cmake glm opencv"
          if [ "${{ inputs.rig }}" = "true" ]; then
            pkgs="$pkgs molten-vk vulkan-headers vulkan-loader"
            pkgs="$pkgs vulkan-validationlayers shaderc glslang spirv-tools"
            pkgs="$pkgs ffmpeg pkgconf glfw"
          fi
          echo "formulae=$pkgs" >> "$GITHUB_OUTPUT"
          missing=""
          for pkg in $pkgs; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ] && [ "${{ runner.environment }}" = self-hosted ]; then
            echo "::error::install by hand on this self-hosted runner's host, while CI is idle:${missing}"
            exit 1
          fi
          if [ -n "$missing" ]; then
            # Retry to ride out a transient fetch error; OpenCV brings many
            # bottles.
            ok=0
            for attempt in 1 2 3; do
              # shellcheck disable=SC2086  # intentional: split $missing
              if brew install $missing; then
                ok=1
                break
              fi
              echo "::warning::brew install attempt ${attempt} failed; retrying in 15s"
              sleep 15
            done
            [ "${ok}" = 1 ] || {
              echo "::error::brew install failed after 3 attempts"
              exit 1
            }
          fi
          if [ "${{ inputs.rig }}" = "true" ]; then
            # The layer's manifest names its library without a path; the Test
            # step alone searches Homebrew's lib for it, as job-wide its
            # libraries would shadow those of every other tool.
            echo "VC_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
            echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          fi

      # Keep the ref at calib's recon pin (third_party/CMakeLists.txt).
      - name: Install the Orbbec SDK
        if: inputs.rig
        uses: taojin-6/volumetric_kit_recon/.github/actions/install-orbbec-sdk@9fd879052e97ac315805d4f42dd231f4457b5112

      # The installed versions of the leg's formulae and of their dependencies,
      # so the first run after a brew upgrade builds the dependency tree afresh
      # (the core's tools/runners/README.md, "Upgrading Homebrew"). Linux has
      # no Homebrew, so its keys carry `none`.
      # The ref is the core commit third_party/CMakeLists.txt pins, so calib
      # keeps one core pin (the core's tools/runners/README.md).
      - name: Homebrew key
        id: brew
        if: runner.os == 'macOS'
        uses: taojin-6/volumetric_kit_core/.github/actions/homebrew-key@ff44a981055d505590e295ff6a943bb1b6e96109
        with:
          formulae: ${{ steps.formulae.outputs.formulae }}

      # Cache the FetchContent dependency tree (sources and builds), keyed as
      # recon's _build.yml keys it, which says why: FetchContent bakes the
      # absolute build path in, so the key carries a hash of the workspace
      # path, and the pins' files. Every key and restore-keys prefix carries
      # the Homebrew key (a pre-commit hook checks), so no tree built on other
      # versions comes back; checkout cleans the rest of build/ each run.
      - name: Workspace fingerprint
        id: ws
        run: |
          h=$(printf '%s' "${GITHUB_WORKSPACE}" |
              { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12)
          echo "hash=${h}" >> "${GITHUB_OUTPUT}"
          echo "workspace ${GITHUB_WORKSPACE} -> ${h}"

      - name: Cache third-party deps
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ inputs.os }}-${{ matrix.build_type }}-so${{ inputs.shared }}-rig${{ inputs.rig }}-tsan${{ inputs.tsan }}-brew${{ steps.brew.outputs.key || 'none' }}-ws${{ steps.ws.outputs.hash }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            deps-${{ inputs.os }}-${{ matrix.build_type }}-so${{ inputs.shared }}-rig${{ inputs.rig }}-tsan${{ inputs.tsan }}-brew${{ steps.brew.outputs.key || 'none' }}-ws${{ steps.ws.outputs.hash }}-

      - name: Configure
        # Retry to ride out transient FetchContent clone failures.
        run: |
          flags=(-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
                 -DBUILD_SHARED_LIBS=${{ inputs.shared && 'ON' || 'OFF' }}
                 -DVC_WITH_RIG=${{ inputs.rig && 'ON' || 'OFF' }})
          if [ "${{ inputs.rig }}" = "true" ]; then
            flags+=(-DVR_WITH_ORBBEC=ON -DVR_WITH_FFMPEG=ON)
          fi
          if [ "${{ inputs.tsan }}" = "true" ]; then
            flags+=(-DVC_SANITIZE=thread)
          fi
          ok=0
          for attempt in 1 2 3; do
            if cmake -S . -B build "${flags[@]}"; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      # A hosted runner sets no level and uses its cores. On a self-hosted
      # runner the levels come from its .env (the core's
      # tools/runners/README.md), or from a leg's container env.
      # They are passed explicitly: a bare `--parallel` runs make with no job
      # limit, ignoring CMAKE_BUILD_PARALLEL_LEVEL. calib_rig needs GLFW and
      # the Orbbec tier; a rig build without it would skip the app's tests
      # silently. Under ThreadSanitizer only VC_TSAN_TESTS' targets are built.
      - name: Build
        run: |
          if [ "${{ inputs.tsan }}" = "true" ]; then
            # shellcheck disable=SC2046,SC2086  # intentional: one per test
            cmake --build build \
              --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}" \
              --target $(printf 'vc_%s_test ' ${VC_TSAN_TESTS})
            exit 0
          fi
          cmake --build build \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"
          if [ "${{ inputs.rig }}" = "true" ]; then
            test -x build/apps/calib_rig
          fi

      - name: Test
        env:
          # The core's test policy, on the rig leg: a GPU test fails, rather
          # than skips, without a device or the validation layer, and fails on
          # any error the layer reports.
          VKC_REQUIRE_VULKAN_DEVICE: ${{ inputs.rig && '1' || '' }}
          VKC_TEST_VALIDATION: ${{ inputs.rig && '1' || '' }}
          TSAN_OPTIONS: ${{ inputs.tsan && 'halt_on_error=1' || '' }}
        # Exported here, as macOS strips DYLD_* from a step's env when it
        # starts the system's bash. The `slow` tests, the full statistical
        # sweeps, and the `package` tests, nested configures of calib
        # (tests/CMakeLists.txt), run on the Release rig leg alone, the one
        # leg that registers every `package` test. Under ThreadSanitizer, the
        # Build step's binaries run the tests of the session writer's and the
        # app's threads (GTEST_FILTER; ctest runs a binary as one test), but
        # not the solve's and the depth checks' numerics, which run on the
        # test's own thread and take minutes there.
        run: |
          if [ -n "${VC_LAYER_LIBRARY_PATH:-}" ]; then
            export DYLD_FALLBACK_LIBRARY_PATH="${VC_LAYER_LIBRARY_PATH}"
          fi
          select=(-LE "slow|package")
          if [ "${{ inputs.tsan }}" = "true" ]; then
            GTEST_FILTER='SessionWriter.*:AppLive*:AppCloud*:AppCapture.*'
            GTEST_FILTER+=':CalibrateWorker.*:CalibrateDepthBesideTheCloud.*'
            GTEST_FILTER+=':CalibrateDepthTest.AStopBetweenCapturesStopsTheRun'
            GTEST_FILTER+=':CalibrateDepthTest.LetsEachCapturesFramesGo'
            GTEST_FILTER+=':CalibrateDepthTest.AFailureOfTheChecksIsPostedAndTheResultsWritten'
            export GTEST_FILTER
            select=(--no-tests=error -R "^(${VC_TSAN_TESTS// /|})$")
          elif [ "${{ inputs.rig }}" = "true" ]; then
            select=()
          fi
          ctest --test-dir build --output-on-failure "${select[@]}" \
            --parallel "${CTEST_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"
