name: build (reusable)

# Build and test for one leg. ci.yml calls this once per entry in its build
# matrix, on a GitHub-hosted runner (pass just `os`) or a self-hosted one
# (`runner`). Debug and Release are both exercised across the legs, so an
# NDEBUG-only or optimizer-exposed break is caught.
on:
  workflow_call:
    inputs:
      os:
        description: Leg identity, used in the job name and cache key (e.g. ubuntu-24.04).
        required: true
        type: string
      runner:
        description: >-
          runs-on label. Empty → use `os` as a GitHub-hosted image; set to a
          self-hosted label (mac) to run the leg there.
        required: false
        type: string
        default: ''
      build_types:
        description: >-
          JSON array of the CMAKE_BUILD_TYPEs this leg builds and tests, one
          job each, e.g. '["Release"]'.
        required: true
        type: string
      opencv:
        description: >-
          Build the OpenCV tiers (VC_WITH_OPENCV) on Homebrew's OpenCV 5
          (DECISIONS.md, 2026-10-12). macOS only.
        required: false
        type: boolean
        default: false
      shared:
        description: >-
          Build shared libraries (BUILD_SHARED_LIBS): a test that calls a
          public symbol left unexported fails to link.
        required: false
        type: boolean
        default: false
      rig:
        description: >-
          Build the rig tiers (VC_WITH_RIG): recon's sensor, video and Orbbec
          tiers against calib's core pin, and gfx for the viz tier, whose GPU
          tests need a device (MoltenVK) and run under the validation layer.
          macOS only.
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(inputs.build_types) }}
    steps:
      # A self-hosted runner keeps its workspace, which other repositories'
      # jobs on the host can read, so the token is not left in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libglm-dev

      # On the self-hosted Mac a job installs nothing and fails naming any
      # formula missing (DECISIONS.md, 2026-10-16); a hosted runner installs
      # what its image lacks.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          # The formulae are bottled, so skip the slow, network-heavy
          # auto-update -- its `git fetch` is what flakes on transient DNS.
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          pkgs="cmake glm"
          if [ "${{ inputs.opencv }}" = "true" ]; then
            pkgs="$pkgs opencv"
          fi
          if [ "${{ inputs.rig }}" = "true" ]; then
            pkgs="$pkgs molten-vk vulkan-headers vulkan-loader"
            pkgs="$pkgs vulkan-validationlayers shaderc ffmpeg pkgconf"
          fi
          missing=""
          for pkg in $pkgs; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ] && [ "${{ runner.environment }}" = self-hosted ]; then
            echo "::error::install by hand on this self-hosted runner's host, while CI is idle:${missing}"
            exit 1
          fi
          if [ -n "$missing" ]; then
            # Retry to ride out a transient fetch error; OpenCV brings many
            # bottles.
            ok=0
            for attempt in 1 2 3; do
              # shellcheck disable=SC2086  # intentional: split $missing
              if brew install $missing; then
                ok=1
                break
              fi
              echo "::warning::brew install attempt ${attempt} failed; retrying in 15s"
              sleep 15
            done
            [ "${ok}" = 1 ] || {
              echo "::error::brew install failed after 3 attempts"
              exit 1
            }
          fi
          if [ "${{ inputs.rig }}" = "true" ]; then
            # The layer's manifest names its library without a path; the Test
            # step alone searches Homebrew's lib for it, as job-wide its
            # libraries would shadow those of every other tool.
            echo "VC_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
            echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          fi

      # Keep the ref at calib's recon pin (third_party/CMakeLists.txt).
      - name: Install the Orbbec SDK
        if: inputs.rig
        uses: taojin-6/volumetric_kit_recon/.github/actions/install-orbbec-sdk@bdbe26e1378a3d4ab46bb89da05b318f6cfe82c2

      # Cache the FetchContent dependency tree (sources and builds), keyed as
      # recon's _build.yml keys it, which says why: FetchContent bakes the
      # absolute build path in, so the key carries a hash of the workspace
      # path, and the pins' files.
      - name: Workspace fingerprint
        id: ws
        run: |
          h=$(printf '%s' "${GITHUB_WORKSPACE}" |
              { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12)
          echo "hash=${h}" >> "${GITHUB_OUTPUT}"
          echo "workspace ${GITHUB_WORKSPACE} -> ${h}"

      - name: Cache third-party deps
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ inputs.os }}-${{ matrix.build_type }}-cv${{ inputs.opencv }}-so${{ inputs.shared }}-rig${{ inputs.rig }}-ws${{ steps.ws.outputs.hash }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            deps-${{ inputs.os }}-${{ matrix.build_type }}-cv${{ inputs.opencv }}-so${{ inputs.shared }}-rig${{ inputs.rig }}-ws${{ steps.ws.outputs.hash }}-

      - name: Configure
        # Retry to ride out transient FetchContent clone failures.
        run: |
          flags=(-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
                 -DVC_WITH_OPENCV=${{ inputs.opencv && 'ON' || 'OFF' }}
                 -DBUILD_SHARED_LIBS=${{ inputs.shared && 'ON' || 'OFF' }}
                 -DVC_WITH_RIG=${{ inputs.rig && 'ON' || 'OFF' }})
          if [ "${{ inputs.rig }}" = "true" ]; then
            flags+=(-DVR_WITH_ORBBEC=ON -DVR_WITH_FFMPEG=ON)
          fi
          ok=0
          for attempt in 1 2 3; do
            if cmake -S . -B build "${flags[@]}"; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      # The levels come from the runner's .env on the Mac (the core's
      # tools/runners/README.md); a hosted runner sets none and uses its cores.
      # They are passed explicitly: a bare `--parallel` runs make with no job
      # limit, ignoring CMAKE_BUILD_PARALLEL_LEVEL.
      - name: Build
        run: |
          cmake --build build \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      - name: Test
        env:
          # The core's test policy, on the rig leg: a GPU test fails, rather
          # than skips, without a device or the validation layer, and fails on
          # any error the layer reports.
          VKC_REQUIRE_VULKAN_DEVICE: ${{ inputs.rig && '1' || '' }}
          VKC_TEST_VALIDATION: ${{ inputs.rig && '1' || '' }}
        # Exported here, as macOS strips DYLD_* from a step's env when it
        # starts the system's bash.
        run: |
          if [ -n "${VC_LAYER_LIBRARY_PATH:-}" ]; then
            export DYLD_FALLBACK_LIBRARY_PATH="${VC_LAYER_LIBRARY_PATH}"
          fi
          ctest --test-dir build --output-on-failure \
            --parallel "${CTEST_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"
